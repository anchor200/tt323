<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iceland on winter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f8f8f8;
            text-align: center;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            max-width: 900px;
            margin: auto;
        }
        .grid-item {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .grid-item img {
            width: 100%;
            height: auto;
            border-radius: 5px;
            cursor: pointer;
        }
        .caption {
            margin-top: 8px;
            font-size: 14px;
            color: #555;
        }
        
        /* モーダルのスタイル */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            max-width: 80%;
            max-height: 80%;
        }
        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>初夏のフランス北西部 写真館</h2>
    <div class="grid-container">
        <div class="grid-item">
            <img src="birding_northern_france_2024/DSC01289.JPG" alt="観察窓から" onclick="openModal(this)">
            <div class="caption">マルコンテール公園の観察窓からのぞいた様子</div>
        </div>
        <div class="grid-item">
            <img src="birding_northern_france_2024/IMG_3359.jpg" alt="湿地の様子" onclick="openModal(this)">
            <div class="caption">マルコンテール公園の湿地の様子</div>
        </div>
        <div class="grid-item">
            <img src="birding_northern_france_2024/DSC01330.jpg" alt="シュバシコウ" onclick="openModal(this)">
            <div class="caption">飛翔するシュバシコウ</div>
        </div>
        <div class="grid-item">
            <img src="birding_northern_france_2024/IMG_3372.jpg" alt="シュバシのひなコウ" onclick="openModal(this)">
            <div class="caption">シュバシコウのひな</div>
        </div>
        <div class="grid-item">
            <img src="birding_northern_france_2024/IMG_3374.jpg" alt="コブハクチョウ" onclick="openModal(this)">
            <div class="caption">コブハクチョウの繁殖</div>
        </div>
        <div class="grid-item">
            <img src="birding_northern_france_2024/IMG_3377.jpg" alt="ソリハシセイタカシギ" onclick="openModal(this)">
            <div class="caption">ソリハシセイタカシギの繁殖</div>
        </div>
        <div class="grid-item">
            <img src="birding_northern_france_2024/IMG_3379.jpg" alt="ニシズグロカモメ" onclick="openModal(this)">
            <div class="caption">ニシズグロカモメ（周囲はユリカモメ）</div>
        </div>
        <div class="grid-item">
            <img src="birding_northern_france_2024/IMG_3328.jpg" alt="足跡" onclick="openModal(this)">
            <div class="caption">海岸にあった足跡</div>
        </div>
        <div class="grid-item">
            <img src="birding_northern_france_2024/IMG_3349.jpg" alt="駅" onclick="openModal(this)">
            <div class="caption">Rang-du-Fliers駅から北を望む</div>
        </div>

    </div>

    <!-- モーダルウィンドウ -->
    <div id="modal" class="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <img id="modal-image" class="modal-content">
    </div>

    <script>
    document.getElementById('modal').style.display = 'none';
        function openModal(img) {
            document.getElementById('modal-image').src = img.src;
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
