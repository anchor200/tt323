<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos from July, 2025</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f8f8f8;
            text-align: center;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            max-width: 900px;
            margin: auto;
        }
        .grid-item {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .grid-item img {
            width: 100%;
            height: auto;
            border-radius: 5px;
            cursor: pointer;
        }
        .caption {
            margin-top: 8px;
            font-size: 14px;
            color: #555;
        }
        
        /* モーダルのスタイル */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            max-width: 80%;
            max-height: 80%;
        }
        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>2025 July 写真館</h2>
    <div class="grid-container">
        <div class="grid-item">
            <img src="2025_07/IMG_3796.jpg" alt="画像0" onclick="openModal(this)">
            <div class="caption">沖縄に年に一度だけ（二試合）やってくるプロ野球。今年は晴れ</div>
        </div>
        <div class="grid-item">
            <img src="2025_07/IMG_3989.jpg" alt="画像1" onclick="openModal(this)">
            <div class="caption">菅平のバス停で繁殖していたジョウビタキの雛。</div>
        </div>
        <div class="grid-item">
            <img src="2025_07/IMG_4010.jpg" alt="画像2" onclick="openModal(this)">
            <div class="caption">ヤマオダマキ。菅平実験場の裏</div>
        </div>
        <div class="grid-item">
            <img src="2025_07/IMG_4024.jpg" alt="画像3" onclick="openModal(this)">
            <div class="caption">菅平湿原。クロミサンザシ</div>
        </div>
        <div class="grid-item">
            <img src="2025_07/IMG_4148.jpg" alt="画像4" onclick="openModal(this)">
            <div class="caption">裏磐梯、五色沼。</div>
        </div>
        <div class="grid-item">
            <img src="2025_07/IMG_4190.jpg" alt="画像5" onclick="openModal(this)">
            <div class="caption">珍しいらしいテツカエデ</div>
        </div>
        <div class="grid-item">
            <img src="2025_07/IMG_4107.jpg" alt="画像6" onclick="openModal(this)">
            <div class="caption">展望台より中瀬沼</div>
        </div>
        <div class="grid-item">
            <img src="2025_07/IMG_4617.jpg" alt="画像7" onclick="openModal(this)">
            <div class="caption">盆踊り。この熱気が石橋</div>
        </div>
        <div class="grid-item">
            <img src="2025_07/IMG_4436.jpg" alt="画像8" onclick="openModal(this)">
            <div class="caption">万博で見たダヴィンチのノート</div>
        </div>
    </div>

    <!-- モーダルウィンドウ -->
    <div id="modal" class="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <img id="modal-image" class="modal-content">
    </div>

    <script>
    document.getElementById('modal').style.display = 'none';
        function openModal(img) {
            document.getElementById('modal-image').src = img.src;
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
