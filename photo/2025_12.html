<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos from November, 2025</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f8f8f8;
            text-align: center;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            max-width: 900px;
            margin: auto;
        }
        .grid-item {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .grid-item img {
            width: 100%;
            height: auto;
            border-radius: 5px;
            cursor: pointer;
        }
        .caption {
            margin-top: 8px;
            font-size: 14px;
            color: #555;
        }
        
        /* モーダルのスタイル */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            max-width: 80%;
            max-height: 80%;
        }
        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>2025 December 写真館</h2>
    <div class="grid-container">
        <div class="grid-item">
            <img src="2025_12/IMG_7740.jpg" alt="カヤクグリ" onclick="openModal(this)">
            <div class="caption">初見のカヤクグリ（逆光）。六甲山はシカがまだ少なく下層植生が豊かなのが、個体数が多い理由か。</div>
        </div>
        <div class="grid-item">
            <img src="2025_12/IMG_7739.png" alt="コガラの飛翔" onclick="openModal(this)">
            <div class="caption">コガラの飛翔</div>
        </div>
        <div class="grid-item">
            <img src="2025_12/IMG_7970.jpg" alt="島根の割り子そば" onclick="openModal(this)">
            <div class="caption">島根の割り子そば。天皇家にも供するものらしい。殻ごと挽くので色が濃い。たれは甘い</div>
        </div>
        <div class="grid-item">
            <img src="2025_12/DSC07445.jpg" alt="ダルマエナガの群れ" onclick="openModal(this)">
            <div class="caption">ダルマエナガの群れ@韓国</div>
        </div>
        <div class="grid-item">
            <img src="2025_12/DSC07404.jpg" alt="クロハゲワシの大群" onclick="openModal(this)">
            <div class="caption">クロハゲワシの大群。幼鳥だけがここに集まるらしい。かなりの数がいるらしく、重要な局所個体群</div>
        </div>
        <div class="grid-item">
            <img src="2025_12/DSC07374.jpg" alt="ワシミミズク" onclick="openModal(this)">
            <div class="caption">ワシミミズク@坡州市、20年以上（代代わりしつつ？）繁殖を続ける</div>
        </div>
        <div class="grid-item">
            <img src="2025_12/IMG_8158.jpg" alt="北朝鮮が見えるスタバ" onclick="openModal(this)">
            <div class="caption">北朝鮮が見えるスタバ。作業している農家、軍人も観察できた</div>
        </div>
    </div>

    <!-- モーダルウィンドウ -->
    <div id="modal" class="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <img id="modal-image" class="modal-content">
    </div>

    <script>
    document.getElementById('modal').style.display = 'none';
        function openModal(img) {
            document.getElementById('modal-image').src = img.src;
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
